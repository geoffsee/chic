name = "chic"
compatibility_date = "2026-01-29"
main = "index.ts"
workers_dev = false
preview_urls = false
minify = true

routes = [
    { pattern = "chic.geoffsee.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

[[kv_namespaces]]
binding = "GUTENBERG_KV"
id = "<your-kv>"
preview_id = "your-kv"

# Deepgram Aura-2 TTS (and other Workers AI models)
[ai]
binding = "AI"






[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1